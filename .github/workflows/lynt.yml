name: Lint

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать vpsmenu.sh из исходников
        run: bash build.sh

      - name: Собранный vpsmenu.sh соответствует src/
        run: bash build.sh --check

      - name: Проверка синтаксиса
        run: bash -n vpsmenu.sh

      - name: ShellCheck
        run: shellcheck -S warning vpsmenu.sh build.sh tests/unit.sh tests/ipv6.sh tests/users.sh

      - name: Автотесты
        run: bash tests/unit.sh

      - name: Репозиторий для самообновления заполнен
        run: |
          if grep -q 'DEFAULT_REPO="CHANGE_ME' vpsmenu.sh; then
            echo "В src/10-constants.sh не заменён CHANGE_ME в DEFAULT_REPO (впиши ник/репозиторий)"; exit 1
          fi

      - name: Версия в файле совпадает с CHANGELOG
        run: |
          ver="$(sed -n 's/^readonly APP_VERSION="\([0-9.]*\)".*/\1/p' vpsmenu.sh | head -n 1)"
          grep -q "^## ${ver}\b" CHANGELOG.md || { echo "В CHANGELOG.md нет раздела для версии ${ver}"; exit 1; }
