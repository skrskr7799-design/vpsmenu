name: vpsmenu CI

on:
  push:
    branches:
      - main
      - feature/ipv6-user-manager
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build generated script from src
        run: bash build.sh

      - name: Commit generated script
        run: |
          if ! git diff --quiet -- vpsmenu.sh; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vpsmenu.sh
            git commit -m "build: regenerate vpsmenu.sh from src"
            git push
          fi

      - name: Run tests
        run: bash tests/run.sh
