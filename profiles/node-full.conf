# Пример профиля vpsmenu: полный стек для ноды.
# Формат: КЛЮЧ=значение (значение до конца строки, без кавычек). 1/0 — включить/выключить шаг.
# NEW_USER и USER_SSH_KEY могут быть ASK — тогда скрипт спросит при применении.
# Скачать на сервере: vpsmenu → 13 «Профили серверов» → 4 «Скачать из GitHub» → имя «node-full».

SYSTEM_UPDATE=1
TIMEZONE=UTC
NEW_USER=ASK
COPY_ROOT_KEYS=1
USER_SSH_KEY=ASK
SSH_DISABLE_ROOT=1
SSH_KEYS_ONLY=0
UFW=1
UFW_EXTRA_PORTS=
NFTABLES=1
FAIL2BAN=1
F2B_MAXRETRY=3
F2B_FINDTIME=10m
F2B_BANTIME=2d
F2B_IGNOREIP=127.0.0.1/8 ::1
DOCKER=1
DOCKER_LOG_SIZE=10m
DOCKER_LOG_FILES=3
BBR=1
SWAP_SIZE=2G
SWAPPINESS=10
AUTOUPDATES=1
AUTOREBOOT=0
SPEEDTEST=0
REMNANODE=1
WATCHDOG=1
WATCHDOG_AUTORESTART=0
WARP=1

